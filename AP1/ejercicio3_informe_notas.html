  <meta charset="UTF-8">
  <title>AP1 - Ejercicio 3: Informe de notas</title>

<body>
  <h1>AP1 - Ejercicio 3: Informe de notas</h1>
  <p>Abre la consola del navegador (F12 &rarr; pestaña <strong>Consola</strong>) y recarga la página (F5) para ver el resultado.</p>
  <p>Para depurar, usa la pestaña <strong>Depurador / Sources</strong>.</p>

<script>
// ============================================================
// EJERCICIO 3: Informe de notas
// Objetivo: mostrar la media de cada alumno y si aprueba (media >= 5).
//
// RESULTADO ESPERADO:
//   Ana tiene una media de 7.50 y su resultado es APROBADO
//   Luis tiene una media de 4.25 y su resultado es SUSPENSO
//
// TAREA: hay 4 errores. Encuéntralos, corrígelos y explica
// con tus palabras qué fallaba en cada caso.
// PISTA: no todos los errores muestran un mensaje en rojo.
// ============================================================

/*
 * ERRORES ENCONTRADOS Y CORREGIDOS (4):
 *
 * 1) Línea 32 (código original) — tipo: EJECUCIÓN
 *    Error: notas.lenght (typo) → undefined → media = NaN.
 *    Corrección: notas.length
 *
 * 2) Línea 36 (código original) — tipo: LÓGICA
 *    Error: resultdo = "APROBADO" crea otra variable; resultado
 *    seguía en "SUSPENSO" (sin mensaje en rojo).
 *    Corrección: resultado = "APROBADO"
 *
 * 3) Líneas 32 y 39 (código original) — tipo: EJECUCIÓN
 *    Error: const media y luego media = media.toFixed(2) → TypeError.
 *    Corrección: declarar media con let.
 *
 * 4) Líneas 47-48 (código original) — tipo: LÓGICA
 *    Error: argumentos al revés (notas, nombre).
 *    Corrección: crearInforme("Ana", notasAna) y crearInforme("Luis", notasLuis).
 */

function crearInforme(nombre, notas) {
  let suma = 0;
  for (let i = 0; i < notas.length; i++) {
    suma = suma + notas[i];
  }

  let media = suma / notas.length;

  let resultado = "SUSPENSO";
  if (media >= 5) {
    resultado = "APROBADO";
  }

  media = media.toFixed(2);

  return nombre + " tiene una media de " + media + " y su resultado es " + resultado;
}

let notasAna = [8, 7, 6, 9];
let notasLuis = [3, 5, 4, 5];

console.log(crearInforme("Ana", notasAna));
console.log(crearInforme("Luis", notasLuis));
</script>
</body>
</html>
